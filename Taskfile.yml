version: '3'

# One command from an empty k3s cluster to the running stack: `task up` (R9, D14).

vars:
  NS: novee-task
  # Image tag. In a git checkout: the short commit hash, plus a suffix hashed from any uncommitted changes. Unpacked
  # from a zip (no .git): a hash of the source files. Either way, different code never reuses an old image.
  TAG:
    sh: |
      if git rev-parse --short HEAD > /dev/null 2>&1; then
        tag=$(git rev-parse --short HEAD)
        if [ -n "$(git status --porcelain)" ]; then
          tag="$tag-dirty-$( (git diff HEAD; git ls-files --others --exclude-standard -z | xargs -0 cat 2>/dev/null) | shasum | cut -c1-8)"
        fi
      else
        tag="src-$(find . \( -name node_modules -o -name .next -o -name dist -o -name generated -o -name .task -o -name videos \) -prune \
          -o -type f -print0 | LC_ALL=C sort -z | xargs -0 shasum | shasum | cut -c1-8)"
      fi
      echo "$tag"
  CONTEXT:
    sh: kubectl config current-context 2>/dev/null || echo none
  IMAGES: api worker web migrate
  # A throwaway Postgres for database tests and for writing migrations.
  SCRATCH_PG: novee-scratch-pg
  SCRATCH_PG_URL: postgresql://novee:novee@localhost:55432/novee

tasks:
  install:
    desc: Install npm dependencies (only when the lockfile changed)
    cmds:
      - npm ci --no-audit --no-fund
    sources:
      - package-lock.json
    generates:
      - node_modules/.package-lock.json

  check:
    desc: Typecheck every workspace, lint, run the tests. Gates every deploy (D13).
    deps: [install]
    cmds:
      - npm run generate
      - npm run typecheck
      - npm run lint
      - npm run test

  gate:
    desc: The deploy gate in Docker (no Node needed on the host) — the same steps as `task check`
    cmds:
      # Quiet on success; on a failure, the end of the build log (the failing step's output). One fixed tag.
      - |
        log=$(mktemp)
        if docker build --progress=plain -f check.Dockerfile -t novee-task/gate . > "$log" 2>&1; then
          rm -f "$log"; echo "Deploy gate passed (typecheck, lint, tests)"
        else
          tail -n 60 "$log"; rm -f "$log"; echo "Deploy gate FAILED: nothing was deployed"; exit 1
        fi

  test:db:
    desc: Database tests against a throwaway Postgres container, with the migrations applied
    deps: [install]
    cmds:
      - defer: { task: scratch-pg:stop }
      - task: scratch-pg:start
      - npm run generate
      - cd packages/db && DATABASE_URL={{.SCRATCH_PG_URL}} npx prisma migrate deploy
      - DATABASE_URL={{.SCRATCH_PG_URL}} npx vitest run -c vitest.db.config.ts

  test:e2e:
    desc: Browser test (R8) against the deployed stack; video goes to proofs/videos/r8
    deps: [install]
    cmds:
      - defer: pkill -f "port-forward svc/web 3000:3000" || true
      - cd apps/web && npx playwright install chromium > /dev/null
      - kubectl -n {{.NS}} port-forward svc/web 3000:3000 > /dev/null 2>&1 &
      - until curl -sf -o /dev/null http://localhost:3000; do sleep 1; done
      - cd apps/web && npx playwright test

  proof:*:
    desc: 'Run one proof and save its output next to it: task proof:r1 (r1…r9; r8 is the browser test)'
    vars:
      SCRIPT:
        sh: ls proofs/{{index .MATCH 0}}-*.sh
    cmds:
      - set -o pipefail; bash {{.SCRIPT}} 2>&1 | tee {{trimSuffix ".sh" .SCRIPT}}.out

  db:migration:
    desc: 'Write a new migration from schema changes: task db:migration NAME=add_something'
    deps: [install]
    requires: { vars: [NAME] }
    cmds:
      - defer: { task: scratch-pg:stop }
      - task: scratch-pg:start
      # Replays the existing migrations into the scratch database, diffs against the schema, writes the new one.
      - cd packages/db && DATABASE_URL={{.SCRATCH_PG_URL}} npx prisma migrate dev --create-only --name {{.NAME}}

  scratch-pg:start:
    internal: true
    cmds:
      - docker run -d --rm --name {{.SCRATCH_PG}} -e POSTGRES_USER=novee -e POSTGRES_PASSWORD=novee -e POSTGRES_DB=novee -p 55432:5432 postgres:16-alpine > /dev/null
      # TCP only opens once the image's init phase is over, so this waits for the real server.
      - until docker exec {{.SCRATCH_PG}} pg_isready -q -h 127.0.0.1 -U novee; do sleep 1; done

  scratch-pg:stop:
    internal: true
    cmds:
      - docker rm -f {{.SCRATCH_PG}} > /dev/null

  build:
    desc: Build every image from the current commit, tagged {{.TAG}}
    cmds:
      - docker build -q -t novee-task/agent-service:dev starter/agent-service
      - docker build -q -f apps/api/Dockerfile -t novee-task/api:{{.TAG}} .
      - docker build -q -f apps/worker/Dockerfile -t novee-task/worker:{{.TAG}} .
      - docker build -q -f apps/web/Dockerfile -t novee-task/web:{{.TAG}} .
      - docker build -q -f packages/db/Dockerfile -t novee-task/migrate:{{.TAG}} .

  load:
    desc: Load the images into the cluster; the method depends on the k3s flavour (context {{.CONTEXT}})
    vars:
      ALL: novee-task/agent-service:dev {{range $i := splitList " " .IMAGES}}novee-task/{{$i}}:{{$.TAG}} {{end}}
    cmds:
      - |
        case "{{.CONTEXT}}" in
          k3d-*)
            k3d image import -c "{{trimPrefix "k3d-" .CONTEXT}}" {{.ALL}} ;;
          orbstack|rancher-desktop)
            echo "{{.CONTEXT}} shares Docker's images with the cluster: nothing to load" ;;
          *)
            echo "Loading into k3s with ctr (needs sudo)"
            docker save {{.ALL}} | sudo k3s ctr images import - ;;
        esac
      - task: prune-images

  prune-images:
    desc: Remove older builds of our images (local Docker, and the k3d node), keeping {{.TAG}}
    internal: true
    cmds:
      # Every edit builds new tags; without this they pile up until the node hits disk pressure and evicts pods.
      # Images still used by a running pod are refused by Docker/containerd, hence `|| true`.
      - docker images 'novee-task/*' | awk 'NR > 1 && $2 != "{{.TAG}}" && $2 != "dev" {print $1":"$2}' | xargs -r docker rmi > /dev/null 2>&1 || true
      - |
        case "{{.CONTEXT}}" in
          k3d-*)
            node="{{.CONTEXT}}-server-0"
            # ctr removes only the named reference; crictl rmi would delete the whole image, including the
            # current tag when an unchanged build shares its content with an old one.
            docker exec "$node" ctr -n k8s.io images ls -q \
              | grep '/novee-task/' | grep -v ':{{.TAG}}$' | grep -v ':dev$' | grep -v '@sha256:' \
              | xargs -r docker exec "$node" ctr -n k8s.io images rm > /dev/null 2>&1 || true ;;
        esac

  infra:
    desc: Apply the namespace and the given infrastructure (Postgres, Temporal, agent-service); wait until ready
    cmds:
      - kubectl apply -f starter/k8s/00-namespace.yaml
      - kubectl apply -f starter/k8s/10-postgres.yaml -f starter/k8s/20-temporal.yaml -f starter/k8s/30-agent-service.yaml
      - kubectl -n {{.NS}} rollout status statefulset/postgres --timeout=180s
      - kubectl -n {{.NS}} rollout status statefulset/temporal --timeout=180s
      - kubectl -n {{.NS}} rollout status deployment/agent-service --timeout=180s

  migrate:
    desc: Run the database migrations as a one-off Job, and wait for it
    cmds:
      - kubectl -n {{.NS}} delete job migrate --ignore-not-found
      - sed "s/__TAG__/{{.TAG}}/" k8s/35-migrate-job.yaml | kubectl apply -f -
      - kubectl -n {{.NS}} wait --for=condition=complete job/migrate --timeout=180s
      - kubectl -n {{.NS}} logs job/migrate --tail=3

  apps:
    desc: Deploy the API, the worker and the web app; wait for their rollouts
    cmds:
      - for f in k8s/40-api.yaml k8s/41-worker.yaml k8s/42-web.yaml; do sed "s/__TAG__/{{.TAG}}/" "$f" | kubectl apply -f -; done
      - kubectl -n {{.NS}} rollout status deployment/api --timeout=180s
      - kubectl -n {{.NS}} rollout status deployment/worker --timeout=180s
      - kubectl -n {{.NS}} rollout status deployment/web --timeout=180s

  up:
    desc: From an empty k3s cluster to the running stack
    cmds:
      - task: gate
      - task: build
      - task: load
      - task: infra
      - task: migrate
      - task: apps
      - echo "Stack is up (images {{.TAG}}). Run 'task open', then http://localhost:3000 (app) and http://localhost:8234 (Temporal)"

  open:
    desc: 'Open the stack locally: the UI on http://localhost:3000, Temporal''s Web UI on http://localhost:8234 (Ctrl-C stops both)'
    deps: [open:web, open:temporal]

  open:web:
    internal: true
    cmds:
      - kubectl -n {{.NS}} port-forward svc/web 3000:3000

  open:temporal:
    internal: true
    cmds:
      # 8234, not 8233: a local Temporal dev server may already hold 8233.
      - kubectl -n {{.NS}} port-forward svc/temporal 8234:8233

  down:
    desc: Delete everything (the whole namespace, including data)
    cmds:
      - kubectl delete namespace {{.NS}} --ignore-not-found

  logs:
    desc: Follow the workers' logs
    cmds:
      - kubectl -n {{.NS}} logs -l app=worker -f --tail=100 --prefix

  cluster:
    desc: "Local development only: create an empty k3d cluster named novee-task"
    cmds:
      - k3d cluster create novee-task --wait
